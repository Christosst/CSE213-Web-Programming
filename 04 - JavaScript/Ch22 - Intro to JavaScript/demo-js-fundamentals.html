  CRITICAL JAVASCRIPT FUNDAMENTALS:
  ─────────────────────────────────
  1. INPUT VALUES ARE ALWAYS STRINGS!
     - Even with `<input type="number">`, `element.value` returns a String!
     - If s1 = "70" and s2 = "80", `s1 + s2` equals `"7080"` (string concatenation), NOT 150!
     - Always explicitly parse inputs with `Number(val)` or `parseFloat(val)`.

  2. CONSOLE METHODS BEYOND console.log():
     - `console.table(arrayOfObjects)` creates a beautifully formatted table in DevTools.
     - `console.warn()` and `console.error()` add visual flags and stack traces.

  3. SOURCES PANEL BREAKPOINTS:
     - Don't just rely on `console.log()` to debug!
     - Set a breakpoint on line 78 in DevTools -> Sources -> click line number.
     - Step through code line-by-line and inspect scope variables in real-time.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Fundamentals Demo — CSE213</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 580px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1e293b;
      background: #f8fafc;
      line-height: 1.5;
    }

    .calculator-card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 1rem;
      margin-bottom: 0.25rem;
      color: #0f172a;
    }

    input[type="number"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
    }

    input[type="number"]:focus {
      outline: 3px solid #6366f1;
      outline-offset: 1px;
      border-color: #6366f1;
    }

    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.75rem;
      background-color: #1e40af;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #1e3a8a;
    }

    .result-display {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 6px;
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      color: #1e40af;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tip-box {
      margin-top: 1.5rem;
      background: #fef9c3;
      border-left: 4px solid #eab308;
      padding: 1rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="calculator-card">
    <header>
      <h1 style="margin-top: 0; color: #0f172a;">Student Grade Calculator</h1>
      <p style="color: #64748b;">Enter three assignment scores (0–100) to calculate the weighted course grade.</p>
    </header>

    <main>
      <label for="score1">Assignment 1 (HTML Basics)</label>
      <input type="number" id="score1" min="0" max="100" value="75">

      <label for="score2">Assignment 2 (CSS Layout)</label>
      <input type="number" id="score2" min="0" max="100" value="85">

      <label for="score3">Assignment 3 (JavaScript DOM)</label>
      <input type="number" id="score3" min="0" max="100" value="65">

      <button type="button" id="calculate-btn">Compute Final Grade</button>

      <!-- Output container -->
      <div id="result-output" class="result-display" aria-live="polite">
        Click button above to calculate...
      </div>

      <div class="tip-box">
        <strong>🎓 Open DevTools &rarr; Console (<kbd>F12</kbd>):</strong>
        When you compute grades, look at the structured table generated by <code>console.table()</code>!
      </div>
    </main>
  </div>

  <script>
    /**
     * Pure function to determine letter grade from a numerical average
     * @param {number} average - Numerical average score
     * @returns {string} Letter grade ('A', 'B', 'C', 'D', 'F')
     */
    function calculateGrade(average) {
      if (average >= 90) return 'A';
      if (average >= 80) return 'B';
      if (average >= 70) return 'C';
      if (average >= 60) return 'D';
      return 'F';
    }

    // Attach click listener to button
    document.getElementById('calculate-btn').addEventListener('click', function () {
      // -------------------------------------------------------------
      // 1. INPUT EXTRACTION & TYPE CONVERSION
      // -------------------------------------------------------------
      // IMPORTANT: `.value` from any HTML input is always of type String.
      // We wrap with Number() to convert "75" -> 75!
      const s1 = Number(document.getElementById('score1').value);
      const s2 = Number(document.getElementById('score2').value);
      const s3 = Number(document.getElementById('score3').value);

      // CLASSROOM EXPERIMENT:
      // Notice what happens without Number():
      // "75" + "85" + "65" would evaluate to "758565" !

      // -------------------------------------------------------------
      // 2. COMPUTATION (SET DEVTOOLS BREAKPOINT HERE!)
      // -------------------------------------------------------------
      const totalScore = s1 + s2 + s3;
      const averageScore = totalScore / 3;
      const letterGrade = calculateGrade(averageScore);

      // -------------------------------------------------------------
      // 3. DISPLAY OUTPUT TO USER
      // -------------------------------------------------------------
      const resultBox = document.getElementById('result-output');
      resultBox.textContent = `Average: ${averageScore.toFixed(1)}% — Final Grade: ${letterGrade}`;

      // -------------------------------------------------------------
      // 4. RICH DEVTOOLS LOGGING (console.table)
      // -------------------------------------------------------------
      console.log('--- Grade Calculation Run ---');
      console.table([
        { Assessment: 'Assignment 1', RawScore: s1, Grade: calculateGrade(s1) },
        { Assessment: 'Assignment 2', RawScore: s2, Grade: calculateGrade(s2) },
        { Assessment: 'Assignment 3', RawScore: s3, Grade: calculateGrade(s3) },
        { Assessment: 'OVERALL AVERAGE', RawScore: averageScore.toFixed(1), Grade: letterGrade }
      ]);
    });
  </script>
</body>
</html>
