<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brief overview: modal layers | CSE213</title><style>body { font-family: system-ui; margin:2rem; } dialog { position:fixed; max-width:30rem; padding:2rem; } dialog::backdrop { background:rgb(0 0 0 / 55%); } :focus-visible { outline:3px solid blue; outline-offset:3px; }</style></head><body><main><h1>Brief overview: modal layers</h1><p>The native dialog handles modal focus and unavailable background content. Inspect its backdrop and fixed positioning.</p><button id="open">Open dialog</button><dialog aria-labelledby="title"><h2 id="title">Practice dialog</h2><p>Tab through the controls; Escape closes the dialog.</p><form method="dialog"><button autofocus>Close</button></form></dialog></main><script>const dialog = document.querySelector('dialog'); document.querySelector('#open').addEventListener('click', function () { dialog.showModal(); });</script></body></html>
